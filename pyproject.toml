[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-tramitia"
version = "1.2.0"
description = "Auditor determinista de seguridad para tres pilares y comparación A/B"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Diego Andrés García Álvarez" },
    { name = "Angel Danilo Marin Giraldo" },
    { name = "Brayan Alexander Salazar Reyes" },
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
reports = ["python-docx>=1.1,<2"]

[project.scripts]
auditor-tramitia = "auditor_tramitia:main"
auditor-tramitia-gui = "interfaz_auditor:main"

[tool.setuptools]
py-modules = ["auditor_tramitia", "generar_informe_evidencia", "interfaz_auditor", "selector_archivos"]
